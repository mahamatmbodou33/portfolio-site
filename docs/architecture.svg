<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4F46E5"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="1199" height="719" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="40" y="50" font-size="22" font-weight="700" fill="#0F172A">mbodou.org · architecture</text>
  <text x="40" y="74" font-size="14" fill="#64748B">Private S3 origin behind CloudFront, serverless contact form, OIDC-based CI/CD. All infrastructure in Terraform.</text>

  <!-- AWS boundary -->
  <rect x="210" y="100" width="950" height="320" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-dasharray="6 5"/>
  <text x="228" y="124" font-size="12" font-weight="600" fill="#B45309" letter-spacing="0.5">AWS ACCOUNT · us-east-1</text>

  <!-- request path -->
  <g>
    <rect x="40" y="150" width="130" height="64" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="105" y="178" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Visitor</text>
    <text x="105" y="198" font-size="12" fill="#64748B" text-anchor="middle">browser · phone</text>
  </g>
  <g>
    <rect x="235" y="150" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="320" y="178" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Route 53</text>
    <text x="320" y="198" font-size="12" fill="#64748B" text-anchor="middle">DNS · alias records</text>
  </g>
  <g>
    <rect x="450" y="142" width="270" height="80" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
    <text x="585" y="170" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">CloudFront</text>
    <text x="585" y="190" font-size="12" fill="#475569" text-anchor="middle">TLS 1.2+ (ACM) · HTTP/2 + HTTP/3</text>
    <text x="585" y="207" font-size="12" fill="#475569" text-anchor="middle">security headers · www → apex</text>
  </g>
  <g>
    <rect x="765" y="150" width="180" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="855" y="178" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">S3 bucket</text>
    <text x="855" y="198" font-size="12" fill="#64748B" text-anchor="middle">private · OAC only</text>
  </g>
  <g>
    <rect x="975" y="150" width="165" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="1057" y="178" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Terraform state</text>
    <text x="1057" y="198" font-size="12" fill="#64748B" text-anchor="middle">S3 · encrypted · locked</text>
  </g>

  <!-- contact path -->
  <g>
    <rect x="485" y="300" width="200" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="585" y="328" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">API Gateway</text>
    <text x="585" y="348" font-size="12" fill="#64748B" text-anchor="middle">HTTP API · throttled</text>
  </g>
  <g>
    <rect x="730" y="300" width="180" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="820" y="328" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Lambda</text>
    <text x="820" y="348" font-size="12" fill="#64748B" text-anchor="middle">Python · validates input</text>
  </g>
  <g>
    <rect x="955" y="300" width="185" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="1047" y="328" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Amazon SES</text>
    <text x="1047" y="348" font-size="12" fill="#64748B" text-anchor="middle">DKIM · to owner's inbox</text>
  </g>

  <!-- connectors -->
  <g fill="none" stroke="#64748B" stroke-width="1.6">
    <path d="M170 182H231" marker-end="url(#arrow)"/>
    <path d="M405 182H446" marker-end="url(#arrow)"/>
    <path d="M720 182H761" marker-end="url(#arrow)"/>
    <path d="M585 222V296" marker-end="url(#arrow)"/>
    <path d="M685 332H726" marker-end="url(#arrow)"/>
    <path d="M910 332H951" marker-end="url(#arrow)"/>
  </g>
  <text x="595" y="264" font-size="12" font-weight="600" fill="#4F46E5">/api/*</text>
  <text x="740" y="173" font-size="12" font-weight="600" fill="#4F46E5" text-anchor="middle">/*</text>

  <!-- CI/CD panel -->
  <rect x="40" y="470" width="545" height="210" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="64" y="502" font-size="15" font-weight="700" fill="#0F172A">CI/CD · GitHub Actions</text>
  <text x="64" y="522" font-size="12" fill="#64748B">OIDC token → AWS STS → credentials that expire within 1 hour. No stored keys.</text>
  <g font-size="13" fill="#0F172A">
    <circle cx="72" cy="553" r="4" fill="#4F46E5"/><text x="86" y="558">Pull request → terraform plan</text>
    <rect x="368" y="541" width="196" height="24" rx="12" fill="#EEF2FF"/><text x="466" y="558" text-anchor="middle" font-size="12" fill="#3730A3">role: tf-plan (read-only)</text>
    <circle cx="72" cy="593" r="4" fill="#4F46E5"/><text x="86" y="598">Merge → your approval → apply</text>
    <rect x="368" y="581" width="196" height="24" rx="12" fill="#EEF2FF"/><text x="466" y="598" text-anchor="middle" font-size="12" fill="#3730A3">role: tf-apply (production)</text>
    <circle cx="72" cy="633" r="4" fill="#4F46E5"/><text x="86" y="638">Push site/ → sync, invalidate, smoke test</text>
    <rect x="368" y="621" width="196" height="24" rx="12" fill="#EEF2FF"/><text x="466" y="638" text-anchor="middle" font-size="12" fill="#3730A3">role: deploy (S3 + cache)</text>
  </g>

  <!-- Observability panel -->
  <rect x="615" y="470" width="545" height="210" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="639" y="502" font-size="15" font-weight="700" fill="#0F172A">Observability &amp; cost</text>
  <text x="639" y="522" font-size="12" fill="#64748B">Every alert is delivered by email through SNS.</text>
  <g font-size="13" fill="#0F172A">
    <circle cx="647" cy="553" r="4" fill="#059669"/><text x="661" y="558">Route 53 health check every 30 s → site-down alarm</text>
    <circle cx="647" cy="593" r="4" fill="#059669"/><text x="661" y="598">CloudWatch alarms: CloudFront 5xx, contact-form errors</text>
    <circle cx="647" cy="633" r="4" fill="#059669"/><text x="661" y="638">AWS Budget $5/month: 80% actual, 100% forecast</text>
  </g>

  <!-- panel links into AWS -->
  <g fill="none" stroke-width="1.6" stroke-dasharray="5 5">
    <path d="M312 470V424" stroke="#4F46E5" marker-end="url(#arrow-accent)"/>
    <path d="M887 470V424" stroke="#059669" marker-end="url(#arrow)"/>
  </g>
  <text x="322" y="452" font-size="12" font-weight="600" fill="#4F46E5">assume role via OIDC</text>
  <text x="897" y="452" font-size="12" font-weight="600" fill="#047857">monitors</text>

  <text x="1160" y="705" font-size="11" fill="#94A3B8" text-anchor="end">~$1–2 per month</text>
</svg>
